<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Transpes GO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* ===== TOPO ===== */
header {
  background: #2c2c2c;
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
}
header img {
  height: 64px;
}

/* ===== LAYOUT ===== */
.container {
  display: flex;
  height: calc(100vh - 60px);
}

.panel {
  width: 380px;
  background: #ffffff;
  padding: 15px;
  box-shadow: 2px 0 6px rgba(0,0,0,0.15);
  overflow-y: auto;
}

.panel h3 {
  margin-top: 0;
  font-size: 15px;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
}

.panel label {
  font-size: 13px;
  font-weight: bold;
  margin-top: 10px;
  display: block;
}

.panel input,
.panel button {
  width: 100%;
  margin-top: 6px;
  padding: 7px;
  box-sizing: border-box;
}

.panel button {
  background: #0078d4;
  color: #fff;
  border: none;
  cursor: pointer;
}

.panel button:hover {
  background: #005fa3;
}

#status {
  margin-top: 10px;
  font-size: 13px;
  font-weight: bold;
}

#log {
  background: #111;
  color: #0f0;
  font-size: 11px;
  padding: 8px;
  height: 140px;
  overflow-y: auto;
  margin-top: 8px;
  border-radius: 4px;
}

#resultadoContainer {
  margin-top: 10px;
  font-size: 12px;
  max-height: 240px;
  overflow-y: auto;
  border-top: 1px solid #ccc;
  padding-top: 6px;
}

#map {
  flex: 1;
}

/* ===== LEGENDA ===== */
.obstaculo-item {
  padding: 6px;
  border-bottom: 1px solid #ddd;
  line-height: 1.4;
}

.obstaculo-critico {
  color: #b00000;
  font-weight: bold;
}

.obstaculo-ok {
  color: #0a6b0a;
}

/* ===== FOOTER ===== */
.footer {
  margin-top: 15px;
  font-size: 11px;
  color: #666;
  text-align: center;
  line-height: 1.5;
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  background: #eef3ff;
  color: #245;
  font-size: 11px;
  margin-top: 6px;
}
</style>
</head>

<body>

<header>
  <img src="logo-transpes.png" alt="Logo">
  <strong>Transpes GO</strong>
</header>

<div class="container">

  <div class="panel">

    <h3>1️⃣ Definir rota</h3>
    <label>Origem</label>
    <input id="origem" type="text" placeholder="Endereço de origem">

    <label>Destino</label>
    <input id="destino" type="text" placeholder="Endereço de destino">

    <button onclick="calcularRota()">Calcular rota</button>

    <h3>2️⃣ Parâmetros do veículo</h3>
    <label>Altura do caminhão (m)</label>
    <input id="alturaCaminhao" type="number" step="0.01" placeholder="Ex: 4.40">

    <h3>3️⃣ Obstáculos</h3>
    <button onclick="verificarObstaculosNaRota()">Verificar obstáculos na rota</button>
    <button onclick="gerarLinkCompartilhavel()">🔗 Copiar link da rota</button>
    <button onclick="gerarPDFServidor()">📄 Exportar PDF profissional</button>
    
    <div class="badge">As bases são carregadas automaticamente ao abrir o site.</div>

    <div id="status">Inicializando…</div>
    <div id="log"></div>

    <h3>Obstáculos na rota</h3>
    <div id="resultadoContainer"></div>

    <div class="footer">
      Desenvolvido por <b>Caio Bertolato Pereira</b><br>
      Reportar problemas: caio.pereira@transpes.com.br
    </div>

  </div>

  <div id="map"></div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÕES DAS FONTES
   ========================================================= */
const CSV_URL_1 =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSmLH9trIDCxy9l_OsUyoHjld5rhAZgYVesTzQu8TGxpuoIRMSLkwwgE-ln1Ux3exuQIIquyzuBb-y3/pub?output=csv"
  + "&t=" + Date.now();

const CSV_URL_2 =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjaCB7K-3Zz9YY4XhIX6sPCqqywoHdZkdz0VPSGyf0_a2C8Zq0Xplzwb7Frh8L--AqFBYJX-MTqxAr/pub?output=csv"
  + "&t=" + Date.now();

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
let obstacles = [];
let map, directionsService, directionsRenderer, rotaPolyline;
let obstacleMarkers = [];
let carregamentoEmAndamento = false;
let basesCarregadas = false;

/* =========================================================
   UTILITÁRIOS GERAIS
   ========================================================= */
function $(id) {
  return document.getElementById(id);
}

function log(msg) {
  $("log").innerHTML += "▶ " + msg + "<br>";
  $("log").scrollTop = $("log").scrollHeight;
}

function setStatus(msg) {
  $("status").innerText = msg;
}

function limparLog() {
  $("log").innerHTML = "";
}

function normalizarTexto(texto) {
  return String(texto || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\w]+/g, "_")
    .replace(/^_+|_+$/g, "");
}

function parseNumeroFlex(valor) {
  if (valor === null || valor === undefined) return NaN;

  const texto = String(valor).trim();

  if (!texto) return NaN;

  // Trata casos como "1.234,56"
  if (texto.includes(",") && texto.includes(".")) {
    const limpo = texto.replace(/\./g, "").replace(",", ".");
    return Number(limpo);
  }

  // Trata casos como "6,51"
  if (texto.includes(",") && !texto.includes(".")) {
    return Number(texto.replace(",", "."));
  }

  // Trata casos comuns com ponto
  return Number(texto);
}

function coordenadasValidas(lat, lng) {
  return Number.isFinite(lat) &&
         Number.isFinite(lng) &&
         lat >= -90 &&
         lat <= 90 &&
         lng >= -180 &&
         lng <= 180;
}
function getBoundsFromPolyline(poly) {
  const bounds = new google.maps.LatLngBounds();
  poly.getPath().forEach(p => bounds.extend(p));
  return bounds;
}
function corrigirCoordenadasBrasil(lat, lng) {
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
    return { lat, lng };
  }

  // Corrige automaticamente para hemisfério sul/oeste (Brasil)
  if (lat > 0) lat = -lat;
  if (lng > 0) lng = -lng;

  return { lat, lng };
}
  
/* =========================================================
   CSV: PARSER DE LINHA
   ========================================================= */
function parseCSVLine(line) {
  const result = [];
  let current = "";
  let insideQuotes = false;

  for (let c of line) {
    if (c === '"') {
      insideQuotes = !insideQuotes;
    } else if (c === "," && !insideQuotes) {
      result.push(current);
      current = "";
    } else {
      current += c;
    }
  }

  result.push(current);

  return result.map(v => v.replace(/^"|"$/g, "").trim());
}

/* =========================================================
   CSV: CONVERTER PARA OBJETOS POR CABEÇALHO
   ========================================================= */
function csvToObjects(csv) {
  const texto = String(csv || "").replace(/^\uFEFF/, "");
  const linhas = texto
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l.length > 0);

  if (!linhas.length) return [];

  const cabecalhosBrutos = parseCSVLine(linhas[0]);
  const cabecalhos = cabecalhosBrutos.map(normalizarTexto);

  const saida = [];

  for (let i = 1; i < linhas.length; i++) {
    const linha = linhas[i];
    if (!linha) continue;

    const colunas = parseCSVLine(linha);
    const obj = {};

    for (let j = 0; j < cabecalhos.length; j++) {
      const chave = cabecalhos[j];
      if (!chave) continue;
      obj[chave] = (colunas[j] ?? "").trim();
    }

    saida.push(obj);
  }

  return saida;
}

function pegarCampo(obj, aliases) {
  for (const alias of aliases) {
    const chave = normalizarTexto(alias);
    if (obj[chave] !== undefined && String(obj[chave]).trim() !== "") {
      return String(obj[chave]).trim();
    }
  }
  return "";
}

function extrairCoordenadasDaLinha(obj) {
  const latTxt = pegarCampo(obj, ["latitude", "lat"]);
  const lngTxt = pegarCampo(obj, ["longitude", "lng", "lon", "long"]);

  if (latTxt && lngTxt) {
    const lat = parseNumeroFlex(latTxt);
    const lng = parseNumeroFlex(lngTxt);
    
    const corrigido = corrigirCoordenadasBrasil(lat, lng);
    return corrigido;
    
  }

  const coordenadasTxt = pegarCampo(obj, ["coordenadas", "coordenada", "coord", "coords"]);
  if (coordenadasTxt) {
  const partes = coordenadasTxt
    .replace(/\s+/g, "")
    .split(/[,;]/);

  if (partes.length >= 2) {
    const lat = parseNumeroFlex(partes[0]);
    const lng = parseNumeroFlex(partes[1]);

    const corrigido = corrigirCoordenadasBrasil(lat, lng);
    return corrigido;
  }
}

  return { lat: NaN, lng: NaN };
}

function extrairAlturasDaLinha(obj) {
  const candidatos = [
    pegarCampo(obj, ["altura_esq", "altura_esquerda", "altura esquerda"]),
    pegarCampo(obj, ["altura_cent", "altura_centro", "altura central", "altura cent"]),
    pegarCampo(obj, ["altura_dir", "altura_direita", "altura direita"]),

    pegarCampo(obj, ["altura1"]),
    pegarCampo(obj, ["altura2"]),
    pegarCampo(obj, ["altura3"])
  ];

  const alturas = candidatos
    .map(parseNumeroFlex)
    .filter(v => Number.isFinite(v));

  return alturas;
}

/* =========================================================
   NORMALIZAÇÃO DAS DUAS BASES
   ========================================================= */
function normalizarRegistroBase1(obj) {
  const via = pegarCampo(obj, ["via", "rodovia", "trecho"]) || "Via não informada";
  const uf = pegarCampo(obj, ["uf", "estado"]) || "";
  const km = pegarCampo(obj, ["km", "quilometro", "kilometro"]) || "";
  const descricao = pegarCampo(obj, ["descricao", "descrição"]) || "";
  const obs = pegarCampo(obj, ["obs", "observacao", "observação"]) || "";
  const dataAfericao = pegarCampo(obj, ["data_da_afericao", "data_afericao", "data"]) || "";
  const fonte = pegarCampo(obj, ["fonte", "evg", "arquivo_evg", "imagem_evg", "arquivo"]) || "";

  const { lat, lng } = extrairCoordenadasDaLinha(obj);
  const alturas = extrairAlturasDaLinha(obj);

  if (!coordenadasValidas(lat, lng)) return null;
  if (!alturas.length) return null;

  return {
    origemBase: "Base histórica",
    origemDetalhe: "Planilha principal de restrições",
    via,
    uf,
    km,
    descricao,
    obs,
    data: dataAfericao,
    fonte,
    lat,
    lng,
    alturas,
    alturaMin: Math.min(...alturas)
    
  };
}

function normalizarRegistroBase2(obj) {
  const dataHora = pegarCampo(obj, ["data_hora", "datahora", "data"]) || "";
  const observacao = pegarCampo(obj, ["observacao", "observacao_livre", "obs"]) || "";
  const fonte = pegarCampo(obj, ["fonte", "evg", "arquivo_evg", "imagem_evg", "arquivo"]) || "";

  const { lat, lng } = extrairCoordenadasDaLinha(obj);
  const alturas = extrairAlturasDaLinha(obj);

  if (!coordenadasValidas(lat, lng)) return null;
  if (!alturas.length) return null;

  return {
    origemBase: "Base formulário",
    origemDetalhe: "Registros enviados pelo site",
    via: "Registro manual",
    uf: "",
    km: "",
    descricao: "Ponto alimentado pelo formulário",
    obs: observacao,
    data: dataHora,
    fonte,
    lat,
    lng,
    alturas,
    alturaMin: Math.min(...alturas)

  };
}

function deduplicarObstaculos(lista) {
  const mapa = new Map();

  for (const item of lista) {
    const chave =
      [
        item.origemBase || "",
        item.via || "",
        item.uf || "",
        item.km || "",
        item.lat.toFixed(6),
        item.lng.toFixed(6),
        item.alturaMin.toFixed(2),
        item.data || "",
        item.obs || ""
      ].join("|");

    if (!mapa.has(chave)) {
      mapa.set(chave, item);
    }
  }

  return Array.from(mapa.values());
}

function extrairObstaculosDaBase(csv, origemTipo) {
  const objetos = csvToObjects(csv);
  const registros = [];

  for (const obj of objetos) {
    let registro = null;

    if (origemTipo === "base1") {
      registro = normalizarRegistroBase1(obj);
    } else if (origemTipo === "base2") {
      registro = normalizarRegistroBase2(obj);
    }

    if (registro) {
      registros.push(registro);
    }
  }

  return registros;
}

/* =========================================================
   MAPA
   ========================================================= */
function gerarLinkCompartilhavel() {
  if (!rotaPolyline) {
    alert("Calcule a rota primeiro.");
    return;
  }

  const path = rotaPolyline.getPath().getArray();

  const coords = path.map(p => [p.lat(), p.lng()]);

  const dados = {
    origem: $("origem").value,
    destino: $("destino").value,
    path: coords
  };

  const encoded = btoa(JSON.stringify(dados));

  const url = `${location.origin}${location.pathname}?rota=${encoded}`;

  navigator.clipboard.writeText(url);

  log("🔗 Link copiado para área de transferência");
}

function carregarRotaDaURL() {
  const params = new URLSearchParams(window.location.search);
  const rota = params.get("rota");

  if (!rota) return;

  try {
    const dados = JSON.parse(atob(rota));

    $("origem").value = dados.origem || "";
    $("destino").value = dados.destino || "";

    const path = (dados.path || []).map(p =>
      new google.maps.LatLng(p[0], p[1])
    );

    rotaPolyline = new google.maps.Polyline({
      path,
      strokeColor: "#0078d4",
      strokeOpacity: 0.8,
      strokeWeight: 4
    });

    rotaPolyline.setMap(map);

    const bounds = new google.maps.LatLngBounds();
    path.forEach(p => bounds.extend(p));
    map.fitBounds(bounds);

    log("🔗 Rota carregada via link");

  } catch (e) {
    console.error(e);
  }
}

async function gerarPDFServidor() {
  setStatus("Gerando PDF no servidor...");

  try {
    const resp = await fetch("http://localhost:3000/gerar-pdf", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url: location.href })
    });

    if (!resp.ok) {
      throw new Error("Erro ao gerar PDF");
    }

    const blob = await resp.blob();

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "rota_transpes.pdf";
    link.click();

    setStatus("PDF gerado com sucesso");

  } catch (e) {
    console.error(e);
    setStatus("Erro ao gerar PDF");
  }
}
  
function initMap() {
  map = new google.maps.Map($("map"), {
    center: { lat: -19.5, lng: -44.0 },
    zoom: 6,
    mapTypeControl: true,
    streetViewControl: false,
    fullscreenControl: true
  });

  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({
    draggable: true,
    suppressMarkers: false,
    preserveViewport: false
  });

  directionsRenderer.setMap(map);

  directionsRenderer.addListener("directions_changed", () => {
    const directions = directionsRenderer.getDirections();
   
    if (rotaPolyline) {
      rotaPolyline.setMap(null);
    }
    
    if (!directions || !directions.routes || !directions.routes.length) return;
    
    rotaPolyline = new google.maps.Polyline({
      path: directions.routes[0].overview_path,
      strokeColor: "#0078d4",
      strokeOpacity: 0.8,
      strokeWeight: 4
    });

    log("↪ Rota alterada manualmente – recalculando obstáculos");
    verificarObstaculosNaRota();
  });

  const options = {
    componentRestrictions: { country: "br" },
    fields: ["formatted_address", "geometry"],
    types: ["geocode"]
  };

  new google.maps.places.Autocomplete($("origem"), options);
  new google.maps.places.Autocomplete($("destino"), options);

  log("Mapa inicializado");
  setStatus("Carregando bases automaticamente...");
  carregarTodasAsBases();
  carregarRotaDaURL(); // 🔥 NOVO
}

/* =========================================================
   CARREGAMENTO AUTOMÁTICO DAS BASES
   ========================================================= */
async function carregarTodasAsBases() {
  carregamentoEmAndamento = true;
  basesCarregadas = false;
  obstacles = [];
  limparLog();
  log("Iniciando carregamento automático das duas planilhas...");
  setStatus("Carregando bases...");

  try {
    const [resp1, resp2] = await Promise.all([
      fetch(CSV_URL_1, { cache: "no-store" }),
      fetch(CSV_URL_2, { cache: "no-store" })
    ]);

    if (!resp1.ok) {
      throw new Error("Falha ao abrir a base 1: " + resp1.status);
    }

    if (!resp2.ok) {
      throw new Error("Falha ao abrir a base 2: " + resp2.status);
    }

    const [csv1, csv2] = await Promise.all([
      resp1.text(),
      resp2.text()
    ]);

    const base1 = extrairObstaculosDaBase(csv1, "base1");
    const base2 = extrairObstaculosDaBase(csv2, "base2");

    obstacles = deduplicarObstaculos([...base1, ...base2]);

    log(`✔ Base histórica carregada: ${base1.length} registros válidos`);
    log(`✔ Base formulário carregada: ${base2.length} registros válidos`);
    log(`✔ Total consolidado após deduplicação: ${obstacles.length}`);

    basesCarregadas = true;
    setStatus("Bases carregadas com sucesso");
    log("✅ Sistema pronto para análise de rota");

  } catch (erro) {
    console.error(erro);
    basesCarregadas = false;
    setStatus("Erro ao carregar bases");
    log("❌ Erro ao carregar as planilhas");
    log(String(erro && erro.message ? erro.message : erro));
  } finally {
    carregamentoEmAndamento = false;
  }
}

/* =========================================================
   ROTA
   ========================================================= */
function calcularRota() {
  const origemTxt = $("origem").value.trim();
  const destinoTxt = $("destino").value.trim();

  if (rotaPolyline) {
    rotaPolyline.setMap(null);
  }
  
  if (!origemTxt || !destinoTxt) {
    alert("Preencha origem e destino.");
    return;
  }

  directionsService.route({
    origin: origemTxt,
    destination: destinoTxt,
    travelMode: "DRIVING"
  }, (res, status) => {
    if (status !== "OK") {
      log("❌ Não foi possível calcular a rota: " + status);
      return;
    }

    directionsRenderer.setDirections(res);

    rotaPolyline = new google.maps.Polyline({
      path: res.routes[0].overview_path,
      strokeColor: "#0078d4",
      strokeOpacity: 0.8,
      strokeWeight: 4
    });

    log("🛣️ Rota calculada com sucesso");
    setStatus("Rota calculada");
  });
}

/* =========================================================
   VERIFICAÇÃO DOS OBSTÁCULOS
   ========================================================= */
function limparMarcadores() {
  obstacleMarkers.forEach(m => m.setMap(null));
  obstacleMarkers = [];
}

function verificarObstaculosNaRota() {
  if (carregamentoEmAndamento) {
    alert("Aguarde o carregamento automático das bases terminar.");
    return;
  }

  if (!basesCarregadas) {
    alert("As bases ainda não foram carregadas corretamente.");
    return;
  }

  if (!rotaPolyline) {
    alert("Calcule a rota primeiro.");
    return;
  }

  const altura = parseNumeroFlex($("alturaCaminhao").value);
  if (isNaN(altura)) {
    alert("Informe a altura do caminhão.");
    return;
  }

  limparMarcadores();
  $("resultadoContainer").innerHTML = "";

  let criticos = 0;
  let encontrados = 0;
  
  const bounds = getBoundsFromPolyline(rotaPolyline);
  
  obstacles.forEach(o => {

  // 🔥 FILTRO RÁPIDO
  if (!bounds.contains(new google.maps.LatLng(o.lat, o.lng))) {
    return;
  }

  const pos = new google.maps.LatLng(o.lat, o.lng);

  const perto = google.maps.geometry.poly.isLocationOnEdge(
    pos,
    rotaPolyline,
    0.005
  );

  if (!perto) return;

    encontrados++;

    const critico = o.alturaMin < altura;
    if (critico) criticos++;

    const marker = new google.maps.Marker({
      map,
      position: pos,
      icon: critico
        ? "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
        : "http://maps.google.com/mapfiles/ms/icons/green-dot.png",
      title: `${o.via || "Via não informada"} | ${critico ? "CRÍTICO" : "OK"}`
    });

    obstacleMarkers.push(marker);

    const infoWindow = new google.maps.InfoWindow({
  content: `
    <div style="font-size:12px; line-height:1.45; min-width:220px">
      <strong>${o.via || "Via não informada"}</strong><br>
      <span style="color:#666">${o.origemBase || "-"}</span><br>
      ${o.origemDetalhe ? `<span style="color:#666">${o.origemDetalhe}</span><br>` : ""}
      ${o.fonte ? `Fonte: <b>${o.fonte}</b><br>` : ""}
      ${o.uf ? `UF: <b>${o.uf}</b><br>` : ""}
      ${o.km ? `KM: <b>${o.km}</b><br>` : ""}
      ${o.descricao ? `Descrição: <b>${o.descricao}</b><br>` : ""}
      ${o.data ? `Data: <b>${o.data}</b><br>` : ""}
      ${o.obs ? `Obs.: <b>${o.obs}</b><br>` : ""}
      <br>
      Coordenadas:<br>
      <b>${o.lat.toFixed(6)}, ${o.lng.toFixed(6)}</b><br><br>

      <u>Alturas registradas</u><br>
      ${o.alturas.map((h, i) => `Altura ${i + 1}: ${h.toFixed(2)} m`).join("<br>")}
      <br><br>

      Altura do caminhão: <b>${altura.toFixed(2)} m</b><br>
      Altura considerada (mínima): <b>${o.alturaMin.toFixed(2)} m</b><br>

      <b style="color:${critico ? "red" : "green"}">
        ${critico ? "❌ BLOQUEANTE" : "✅ OK"}
      </b>
    </div>
  `
});

    marker.addListener("mouseover", () => {
      infoWindow.open(map, marker);
    });

    marker.addListener("mouseout", () => {
      infoWindow.close();
    });

    const div = document.createElement("div");
    div.className = "obstaculo-item " + (critico ? "obstaculo-critico" : "obstaculo-ok");

    div.innerHTML = `
      📍 <b>${o.via || "Via não informada"}</b><br>
      ${o.origemBase ? `Base: ${o.origemBase}<br>` : ""}
      ${o.fonte ? `Fonte: ${o.fonte}<br>` : ""}
      ${o.uf ? `UF: ${o.uf}<br>` : ""}
      ${o.km ? `KM: ${o.km}<br>` : ""}
      ${o.descricao ? `Descrição: ${o.descricao}<br>` : ""}
      ${o.obs ? `Obs.: ${o.obs}<br>` : ""}
      Coordenadas: ${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}<br>
      Altura min.: ${o.alturaMin.toFixed(2)} m<br>
      Status: ${critico ? "🚫 CRÍTICO" : "✅ OK"}
`;

    $("resultadoContainer").appendChild(div);
  });

  log(`📍 Obstáculos encontrados na rota: ${encontrados}`);
  log(`🚧 Obstáculos críticos: ${criticos}`);

  if (encontrados === 0) {
    setStatus("Rota verificada, mas nenhum obstáculo foi encontrado no traçado.");
  } else {
    setStatus("Verificação concluída");
  }
}

/* =========================================================
   AJUSTES DE UX
   ========================================================= */
window.addEventListener("load", () => {
  setStatus("Aguardando carregamento do mapa...");
});
</script>

</script>
