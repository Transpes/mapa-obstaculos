<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Obstáculos Rodoviários</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* ===== TOPO ===== */
header {
  background: #2c2c2c;
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
}
header img { height: 64px; }

/* ===== LAYOUT ===== */
.container {
  display: flex;
  height: calc(100vh - 60px);
}

.panel {
  width: 380px;
  background: #ffffff;
  padding: 15px;
  box-shadow: 2px 0 6px rgba(0,0,0,0.15);
  overflow-y: auto;
}

.panel h3 {
  margin-top: 0;
  font-size: 15px;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
}

.panel label {
  font-size: 13px;
  font-weight: bold;
  margin-top: 10px;
  display: block;
}

.panel input,
.panel button {
  width: 100%;
  margin-top: 6px;
  padding: 7px;
  box-sizing: border-box;
}

.panel button {
  background: #0078d4;
  color: #fff;
  border: none;
  cursor: pointer;
}

.panel button:hover {
  background: #005fa3;
}

#status {
  margin-top: 10px;
  font-size: 13px;
  font-weight: bold;
}

#log {
  background: #111;
  color: #0f0;
  font-size: 11px;
  padding: 8px;
  height: 140px;
  overflow-y: auto;
  margin-top: 8px;
}

#resultadoContainer {
  margin-top: 10px;
  font-size: 12px;
  max-height: 240px;
  overflow-y: auto;
  border-top: 1px solid #ccc;
  padding-top: 6px;
}

#map {
  flex: 1;
}

/* ===== LEGENDA ===== */
.obstaculo-item {
  padding: 6px;
  border-bottom: 1px solid #ddd;
  line-height: 1.4;
}

.obstaculo-critico {
  color: #b00000;
  font-weight: bold;
}

.obstaculo-ok {
  color: #0a6b0a;
}

/* ===== FOOTER ===== */
.footer {
  margin-top: 15px;
  font-size: 11px;
  color: #666;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <img src="logo-transpes.png" alt="Logo">
  <strong>Sistema de Obstáculos Rodoviários</strong>
</header>

<div class="container">

<div class="panel">

<h3>1️⃣ Definir rota</h3>
<label>Origem</label>
<input id="origem" type="text" placeholder="Endereço de origem">

<label>Destino</label>
<input id="destino" type="text" placeholder="Endereço de destino">

<button onclick="calcularRota()">Calcular rota</button>

<h3>2️⃣ Parâmetros do veículo</h3>
<label>Altura do caminhão (m)</label>
<input id="alturaCaminhao" type="number" step="0.01" placeholder="Ex: 4.40">

<h3>3️⃣ Obstáculos</h3>
<button onclick="carregarPlanilha()">Carregar obstáculos</button>
<button onclick="verificarObstaculosNaRota()">Verificar obstáculos na rota</button>

<div id="status">Aguardando…</div>
<div id="log"></div>

<h3>Obstáculos na rota</h3>
<div id="resultadoContainer"></div>

<div class="footer">
  Desenvolvido por <b>Caio Bertolato Pereira</b><br>
  Reportar problemas: caio.pereira@transpes.com.br
</div>

</div>

<div id="map"></div>
</div>

<script>
const CSV_URL =
  "https://corsproxy.io/?" +
  encodeURIComponent(
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSmLH9trIDCxy9l_OsUyoHjld5rhAZgYVesTzQu8TGxpuoIRMSLkwwgE-ln1Ux3exuQIIquyzuBb-y3/pub?gid=1651169068&single=true&output=csv"
  ) +
  "&t=" + Date.now();

let obstacles = [];
let map, directionsService, directionsRenderer, rotaPolyline;
let obstacleMarkers = [];

/* ===== UTIL ===== */
function log(msg) {
  document.getElementById("log").innerHTML += "▶ " + msg + "<br>";
}
function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

/* ===== CSV ===== */
function parseCSVLine(line) {
  const result = [];
  let current = "";
  let insideQuotes = false;

  for (let c of line) {
    if (c === '"') insideQuotes = !insideQuotes;
    else if (c === "," && !insideQuotes) {
      result.push(current); current = "";
    } else current += c;
  }
  result.push(current);
  return result.map(v => v.replace(/^"|"$/g,"").trim());
}

/* ===== MAPA ===== */
function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: -19.5, lng: -44.0 },
    zoom: 6
  });

  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({
    draggable: true
  });
  directionsRenderer.setMap(map);

  directionsRenderer.addListener("directions_changed", () => {
    const directions = directionsRenderer.getDirections();
    if (!directions || !directions.routes.length) return;

    rotaPolyline = new google.maps.Polyline({
      path: directions.routes[0].overview_path
    });

    log("↪ Rota alterada manualmente – recalculando obstáculos");
    verificarObstaculosNaRota();
  });

  const options = {
    componentRestrictions: { country: "br" },
    fields: ["formatted_address", "geometry"],
    types: ["geocode"]
  };

  new google.maps.places.Autocomplete(origem, options);
  new google.maps.places.Autocomplete(destino, options);
}

/* ===== PLANILHA ===== */
async function carregarPlanilha() {
  obstacles = [];
  log("Iniciando download do CSV");
  setStatus("Carregando planilha...");

  const resp = await fetch(CSV_URL);
  const csv = await resp.text();
  const linhas = csv.split("\n");

  let validos = 0;

  for (let i = 1; i < linhas.length; i++) {
    const c = parseCSVLine(linhas[i]);
    if (c.length < 8) continue;

    const alturas = [c[4], c[5], c[6]]
      .map(v => parseFloat(v.replace(",", ".")))
      .filter(v => !isNaN(v));

    if (!alturas.length) continue;

    const [lat, lng] = c[7].split(",").map(Number);
    if (isNaN(lat) || isNaN(lng)) continue;

    obstacles.push({
      via: c[0],
      km: c[2],
      lat, lng,
      alturaMax: Math.max(...alturas)
    });

    validos++;
  }

  log(`✔ Obstáculos carregados: ${validos}`);
  setStatus("Planilha carregada");
}

/* ===== ROTA ===== */
function calcularRota() {
  directionsService.route({
    origin: origem.value,
    destination: destino.value,
    travelMode: "DRIVING"
  }, (res, status) => {
    if (status !== "OK") return;

    directionsRenderer.setDirections(res);
    rotaPolyline = new google.maps.Polyline({
      path: res.routes[0].overview_path
    });

    log("🛣️ Rota calculada");
  });
}

/* ===== VERIFICAÇÃO ===== */
function verificarObstaculosNaRota() {
  if (!rotaPolyline) return;

  const altura = parseFloat(alturaCaminhao.value);
  if (isNaN(altura)) return alert("Informe a altura do caminhão");

  obstacleMarkers.forEach(m => m.setMap(null));
  obstacleMarkers = [];
  resultadoContainer.innerHTML = "";

  let criticos = 0;

  obstacles.forEach(o => {
    const pos = new google.maps.LatLng(o.lat, o.lng);

    const perto = google.maps.geometry.poly.isLocationOnEdge(
      pos,
      rotaPolyline,
      0.01
    );

    if (!perto) return;

    const critico = o.alturaMax < altura;
    if (critico) criticos++;

    const marker = new google.maps.Marker({
      map,
      position: pos,
      icon: critico
        ? "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
        : "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
    });

    obstacleMarkers.push(marker);

    /* ===== INFO WINDOW (NOVO) ===== */
    const infoWindow = new google.maps.InfoWindow({
      content: `
        <div style="font-size:12px; line-height:1.4">
          <strong>${o.via || "Via não informada"}</strong><br>
          KM: ${o.km || "-"}<br>
          Coordenadas:<br>
          ${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}<br><br>
          Altura do obstáculo: <b>${o.alturaMax.toFixed(2)} m</b><br>
          Altura do caminhão: <b>${altura.toFixed(2)} m</b><br>
          <b style="color:${critico ? "red" : "green"}">
            ${critico ? "❌ BLOQUEANTE" : "✅ OK"}
          </b>
        </div>
      `
    });

    marker.addListener("mouseover", () => {
      infoWindow.open(map, marker);
    });

    marker.addListener("mouseout", () => {
      infoWindow.close();
    });

    /* ===== LEGENDA ===== */
    const div = document.createElement("div");
    div.className =
      "obstaculo-item " + (critico ? "obstaculo-critico" : "obstaculo-ok");

    div.innerHTML = `
      📍 <b>${o.via || "Via não informada"}</b><br>
      KM: ${o.km || "-"}<br>
      Coordenadas: ${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}<br>
      Altura máx.: ${o.alturaMax.toFixed(2)} m<br>
      Status: ${critico ? "🚫 CRÍTICO" : "✅ OK"}
    `;

    resultadoContainer.appendChild(div);
  });

  log(`🚧 Obstáculos críticos: ${criticos}`);
  setStatus("Verificação concluída");
}
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsCCdeA0KSgHffeuSmsDyaGT86ZJytIz4&libraries=geometry,places&callback=initMap"
  async defer>
</script>

</body>
</html>
