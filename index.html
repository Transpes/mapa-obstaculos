<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Sistema de Obstáculos Rodoviários</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    header {
      background: #2c2c2c;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    header img {
      height: 32px;
    }

    .container {
      display: flex;
      height: calc(100vh - 60px);
    }

    .panel {
      width: 360px;
      background: #ffffff;
      padding: 15px;
      box-shadow: 2px 0 6px rgba(0,0,0,0.15);
      overflow-y: auto;
    }

    .panel h3 {
      margin-top: 0;
    }

    .panel label {
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    .panel input,
    .panel button {
      width: 100%;
      margin-top: 5px;
      padding: 7px;
      box-sizing: border-box;
    }

    .panel button {
      background: #0078d4;
      color: #fff;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    .panel button:hover {
      background: #005fa3;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
    }

    #map {
      flex: 1;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <img src="logo.png" alt="Logo">
  <strong>Sistema de Obstáculos Rodoviários</strong>
</header>

<div class="container">

  <div class="panel">
    <h3>Rota</h3>

    <label>Origem</label>
    <input id="origem" type="text" placeholder="Endereço de origem">

    <label>Destino</label>
    <input id="destino" type="text" placeholder="Endereço de destino">

    <button onclick="calcularRota()">Calcular rota</button>

    <label>Altura do caminhão (m)</label>
    <input id="altura" type="number" step="0.01" placeholder="Ex: 4.40">

    <button onclick="verificarObstaculos()">Verificar obstáculos</button>

    <div id="status">Aguardando...</div>

    <div class="footer">
      Desenvolvido por Caio Bertolato Pereira<br>
      Reportar problemas: seu.email@empresa.com
    </div>
  </div>

  <div id="map"></div>
</div>

<script>
  let map;
  let directionsService;
  let directionsRenderer;

  /* ================= MAPA ================= */
  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: -19.5, lng: -44.0 },
      zoom: 6
    });

    directionsService = new google.maps.DirectionsService();

    directionsRenderer = new google.maps.DirectionsRenderer({
      preserveViewport: false,
      draggable: true
    });

    directionsRenderer.setMap(map);

    // Recalcular quando arrastar rota
    directionsRenderer.addListener("directions_changed", () => {
      document.getElementById("status").innerText =
        "Rota alterada manualmente. Recalcule os obstáculos.";
    });

    // AUTOCOMPLETE
    const options = {
      componentRestrictions: { country: "br" },
      fields: ["formatted_address", "geometry"],
      types: ["geocode"]
    };

    new google.maps.places.Autocomplete(
      document.getElementById("origem"),
      options
    );

    new google.maps.places.Autocomplete(
      document.getElementById("destino"),
      options
    );
  }

  /* ================= ROTA ================= */
  function calcularRota() {
    const origem = document.getElementById("origem").value;
    const destino = document.getElementById("destino").value;

    if (!origem || !destino) {
      alert("Informe origem e destino");
      return;
    }

    directionsService.route(
      {
        origin: origem,
        destination: destino,
        travelMode: google.maps.TravelMode.DRIVING
      },
      (result, status) => {
        if (status === "OK") {
          directionsRenderer.setDirections(result);
          document.getElementById("status").innerText =
            "Rota calculada. Verifique os obstáculos.";
        } else {
          alert("Erro ao calcular rota: " + status);
        }
      }
    );
  }

  /* ================= OBSTÁCULOS ================= */
  function verificarObstaculos() {
    const altura = parseFloat(document.getElementById("altura").value);

    if (isNaN(altura)) {
      alert("Informe a altura do caminhão");
      return;
    }

    // Aqui entra sua lógica atual de:
    // - leitura do CSV / Google Sheets
    // - cálculo de distância à rota
    // - comparação de altura

    document.getElementById("status").innerText =
      "Obstáculos verificados (simulação).";
  }
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsCCdeA0KSgHffeuSmsDyaGT86ZJytIz4&libraries=places,geometry&callback=initMap"
  async defer>
</script>

</body>
</html>
