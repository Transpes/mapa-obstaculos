<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Obstáculos via Google Sheets</title>

<style>
/* ================= FAIXA TOPO ================= */
#topo {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #2e2e2e;
  color: white;
  padding: 12px 20px;
  border-radius: 6px;
  margin-bottom: 16px;
}

#topo img {
  height: 120px;
  object-fit: contain;
}

#topo h1 {
  font-size: 20px;
  margin: 0;
  font-weight: 600;
}

body { font-family: Arial; margin: 10px; }
button { padding: 8px 14px; font-size: 14px; cursor:pointer; }

#status { font-weight: bold; margin: 10px 0; }

#log {
  background: #111;
  color: #0f0;
  padding: 8px;
  height: 160px;
  overflow-y: auto;
  font-size: 12px;
}

#resultadoContainer {
  max-height: 260px;
  overflow-y: auto;
  border: 1px solid #ccc;
  font-size: 12px;
  margin-top: 10px;
}

/* ================= LAYOUT ================= */
#layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 16px;
}

#painel {
  background: #f5f5f5;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

.bloco {
  margin-bottom: 16px;
}

.bloco h3 {
  margin: 0 0 8px;
  font-size: 14px;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
}

#map {
  width: 100%;
  height: 500px;
  border: 1px solid #ccc;
}

#rodape {
  margin-top: 16px;
  font-size: 11px;
  color: #666;
  text-align: center;
}
</style>
</head>

<body>

<div id="topo">
  <img src="logo-transpes.png" alt="Transpes">
  <h1>Sistema de Obstáculos Rodoviários</h1>
</div>

<div id="layout">

  <!-- PAINEL LATERAL -->
  <div id="painel">

    <div class="bloco">
      <h3>1️⃣ Definir rota</h3>
      <input id="origem" type="text" placeholder="Origem" style="width:100%">
      <br><br>
      <input id="destino" type="text" placeholder="Destino" style="width:100%">
      <br><br>
      <button onclick="calcularRota()">Calcular rota</button>
    </div>

    <div class="bloco">
      <h3>2️⃣ Parâmetros do veículo</h3>
      <input id="alturaCaminhao" type="number" step="0.01"
             placeholder="Altura do caminhão (m)" style="width:100%">
    </div>

    <div class="bloco">
      <h3>3️⃣ Obstáculos</h3>
      <button onclick="carregarPlanilha()">Carregar obstáculos</button>
      <br><br>
      <button onclick="verificarObstaculosNaRota()">Verificar na rota</button>
    </div>

    <div id="status">Aguardando…</div>
    <div id="log"></div>

  </div>

  <!-- MAPA -->
  <div>
    <div id="map"></div>
  </div>

</div>

<h3>Obstáculos verificados na rota</h3>
<div id="resultadoContainer"></div>

<div id="rodape">
  Sistema desenvolvido internamente — responsável técnico: Caio Bertolato Pereira<br>
  Sugestões ou problemas: caio.pereira@transpes.com.br
</div>

<script>
/* ===== TODO O SEU JAVASCRIPT PERMANECE IGUAL ===== */
/* (não alterei nenhuma lógica, apenas HTML/CSS) */
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsCCdeA0KSgHffeuSmsDyaGT86ZJytIz4&libraries=geometry,places&callback=initMap"
  async defer>
</script>

</body>
</html>
